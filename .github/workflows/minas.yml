name: Minas
on:
  schedule:
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: minas
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python gold.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
      - if: always()
        run: |
          git config user.name "minas-bot"
          git config user.email "minas-bot@users.noreply.github.com"
          git add -A
          git diff --cited --quiet 2>/dev/null; git diff --cached --quiet || (git commit -m "update state" && (git push || (git pull --rebase && git push)))
